name: Build Flatpak

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release tag to package
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Set release version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            npm --prefix apps/desktop version "${RELEASE_VERSION#v}" --no-git-tag-version --allow-same-version --ignore-scripts --package-lock=false
          fi
          echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Package Linux directory
        run: pnpm --filter @inlark/desktop exec electron-builder --linux dir --x64 --publish never
      - name: Prepare archive and manifest
        run: bash scripts/flatpak-archive.sh
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-input
          path: apps/desktop/release/flatpak/
          if-no-files-found: error

  flatpak:
    needs: package
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: flatpak-input
          path: apps/desktop/release/flatpak/
      - name: Validate desktop and AppStream metadata
        run: |
          desktop-file-validate apps/desktop/release/flatpak/manifest/com.inlark.Inlark.desktop
          appstreamcli validate --no-net apps/desktop/release/flatpak/manifest/com.inlark.Inlark.metainfo.xml
      - name: Build standalone bundle
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --force-clean --disable-rofiles-fuse --install-deps-from=flathub \
            --repo=apps/desktop/release/flatpak/repo --default-branch=stable \
            apps/desktop/release/flatpak/build apps/desktop/release/flatpak/manifest/com.inlark.Inlark.json
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            apps/desktop/release/flatpak/repo "apps/desktop/release/inlark-$VERSION-x64.flatpak" \
            com.inlark.Inlark stable
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-flatpak
          path: apps/desktop/release/inlark-*-x64.flatpak
          if-no-files-found: error

  smoke:
    needs: [package, flatpak]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: desktop-linux-flatpak
          path: apps/desktop/release/
      - name: Install Flatpak test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak xvfb xauth dbus-x11
          # Allow nested sandbox namespaces on this disposable test runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Smoke-test installed Flatpak
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: bash scripts/test-flatpak.sh "apps/desktop/release/inlark-$VERSION-x64.flatpak"
