name: Release desktop app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate release version
        shell: bash
        run: |
          npm --prefix apps/desktop version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version --ignore-scripts --package-lock=false
          node -e 'const version = require("./apps/desktop/package.json").version; const tag = process.env.GITHUB_REF_NAME; if (tag !== "v" + version) { console.error("Expected tag v" + version + ", got " + tag); process.exit(1) }'

  build:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: linux-x64
            args: --linux AppImage deb rpm --x64
            expected: 3
            metadataSuffix: -linux
          - runner: windows-2025
            name: windows-x64
            args: --win nsis --x64
            expected: 1
            metadataSuffix: ''
          - runner: macos-15
            name: macos-both
            args: --mac dmg zip --x64 --arm64
            expected: 4
            metadataSuffix: -mac
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing macOS release credential: $name."
              exit 1
            fi
          done
          umask 077
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Set desktop version from tag
        shell: bash
        run: npm --prefix apps/desktop version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version --ignore-scripts --package-lock=false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install RPM packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build desktop app
        run: pnpm build
      - name: Prepare Windows signing with Certum
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: bash
        env:
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}
        run: |
          for name in CERTUM_OTP_URI CERTUM_USERNAME CERTUM_CERTIFICATE_SHA1; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Windows release credential: $name."
              exit 1
            fi
          done
          powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/install-simplysign.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/configure-simplysign.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/connect-simplysign.ps1
      - name: Package desktop app
        if: runner.os == 'Linux'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @inlark/desktop exec electron-builder ${{ matrix.args }} --publish never
      - name: Sign and package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}
          CERTUM_TIMESTAMP_SERVER: ${{ vars.CERTUM_TIMESTAMP_SERVER || 'http://time.certum.pl' }}
        run: |
          $intermediate = Join-Path $env:RUNNER_TEMP 'certum.cer'
          Invoke-WebRequest -Uri https://repository.certum.pl/ccsca2021.cer -OutFile $intermediate
          $thumbprint = ($env:CERTUM_CERTIFICATE_SHA1 -replace '\s', '').ToUpperInvariant()
          pnpm --filter @inlark/desktop exec electron-builder ${{ matrix.args }} --publish never `
            "--config.win.signtoolOptions.certificateSha1=$thumbprint" `
            "--config.win.signtoolOptions.additionalCertificateFile=$intermediate" `
            "--config.win.signtoolOptions.rfc3161TimeStampServer=$env:CERTUM_TIMESTAMP_SERVER"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify signed Windows app and installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERTUM_CERTIFICATE_SHA1: ${{ secrets.CERTUM_CERTIFICATE_SHA1 }}
        run: ./.github/scripts/verify-windows-signatures.ps1
      - name: Sign, notarize and package macOS app
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm --filter @inlark/desktop exec electron-builder ${{ matrix.args }} --publish never
      - name: Verify signed and notarized macOS ZIPs
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for arch in x64 arm64; do
            archive="apps/desktop/release/inlark-${version}-${arch}.zip"
            test -f "$archive"
            test -f "${archive}.blockmap"
            test -f "apps/desktop/release/inlark-${version}-${arch}.dmg"
            destination="$RUNNER_TEMP/verify-macos-$arch"
            ditto -x -k "$archive" "$destination"
            app="$destination/inlark.app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --display --verbose=4 "$app" 2>&1 | grep -F 'Authority=Developer ID Application:'
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          done
      - name: Remove macOS notarization key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Collect installers
        shell: bash
        run: |
          mkdir release-assets
          for file in apps/desktop/release/*; do
            case "$file" in
              *builder-debug.yml) ;;
              *.AppImage|*.deb|*.rpm|*.exe|*.dmg|*.zip|*.yml|*.blockmap) cp "$file" release-assets/ ;;
            esac
          done
          count=$(find release-assets -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) | wc -l)
          expected=${{ matrix.expected }}
          if [ "$count" -ne "$expected" ]; then
            echo "Expected $expected installers, found $count" >&2
            exit 1
          fi
          channel="${GITHUB_REF_NAME#v}"
          if [[ "$channel" == *-* ]]; then
            channel="${channel#*-}"
            channel="${channel%%.*}"
          else
            channel=latest
          fi
          test -f "release-assets/${channel}${{ matrix.metadataSuffix }}.yml"
          ls -lh release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: release-assets/
          if-no-files-found: error

  nix:
    needs: validate-tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Set desktop version from tag
        shell: bash
        run: npm --prefix apps/desktop version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version --ignore-scripts --package-lock=false
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - name: Check flake and build Nix package
        run: nix flake check --no-write-lock-file
      - name: Check profile installation
        run: |
          nix profile install --profile "$RUNNER_TEMP/inlark-profile" .#inlark
          test -x "$RUNNER_TEMP/inlark-profile/bin/inlark"
          test -f "$RUNNER_TEMP/inlark-profile/share/applications/inlark.desktop"
          test -f "$RUNNER_TEMP/inlark-profile/share/icons/hicolor/512x512/apps/inlark.png"

  release:
    needs: [build, nix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          count=$(find release-assets -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) | wc -l)
          if [ "$count" -ne 8 ]; then
            echo "Expected 8 installers, found $count" >&2
            exit 1
          fi
          channel="${RELEASE_TAG#v}"
          if [[ "$channel" == *-* ]]; then
            channel="${channel#*-}"
            channel="${channel%%.*}"
          else
            channel=latest
          fi
          for suffix in '' -mac -linux; do
            test -f "release-assets/${channel}${suffix}.yml"
          done
          for arch in x64 arm64; do
            archive="inlark-${RELEASE_TAG#v}-${arch}.zip"
            test -f "release-assets/$archive"
            test -f "release-assets/${archive}.blockmap"
            grep -F -- "$archive" "release-assets/${channel}-mac.yml"
          done
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --generate-notes "${options[@]}"
