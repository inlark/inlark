name: Release desktop app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag against desktop version
        shell: bash
        run: |
          node -e 'const version = require("./apps/desktop/package.json").version; const tag = process.env.GITHUB_REF_NAME; if (tag !== "v" + version) { console.error("Expected tag v" + version + ", got " + tag); process.exit(1) }'

  build:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: linux-x64
            args: --linux AppImage deb rpm --x64
            expected: 3
            metadataSuffix: -linux
          - runner: windows-2025
            name: windows-x64
            args: --win nsis --x64
            expected: 1
            metadataSuffix: ''
          - runner: macos-15
            name: macos-both
            args: --mac dmg zip --x64 --arm64
            expected: 4
            metadataSuffix: -mac
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install RPM packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build desktop app
        run: pnpm build
      - name: Package desktop app
        run: pnpm --filter @inlark/desktop exec electron-builder ${{ matrix.args }} --publish never
      - name: Collect installers
        shell: bash
        run: |
          mkdir release-assets
          for file in apps/desktop/release/*; do
            case "$file" in
              *builder-debug.yml) ;;
              *.AppImage|*.deb|*.rpm|*.exe|*.dmg|*.zip|*.yml|*.blockmap) cp "$file" release-assets/ ;;
            esac
          done
          count=$(find release-assets -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) | wc -l)
          expected=${{ matrix.expected }}
          if [ "$count" -ne "$expected" ]; then
            echo "Expected $expected installers, found $count" >&2
            exit 1
          fi
          channel="${GITHUB_REF_NAME#v}"
          if [[ "$channel" == *-* ]]; then
            channel="${channel#*-}"
            channel="${channel%%.*}"
          else
            channel=latest
          fi
          test -f "release-assets/${channel}${{ matrix.metadataSuffix }}.yml"
          ls -lh release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: release-assets/
          if-no-files-found: error

  nix:
    needs: validate-tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - name: Check flake and build Nix package
        run: nix flake check --no-write-lock-file
      - name: Check profile installation
        run: |
          nix profile install --profile "$RUNNER_TEMP/inlark-profile" .#inlark
          test -x "$RUNNER_TEMP/inlark-profile/bin/inlark"
          test -f "$RUNNER_TEMP/inlark-profile/share/applications/inlark.desktop"
          test -f "$RUNNER_TEMP/inlark-profile/share/icons/hicolor/512x512/apps/inlark.png"

  release:
    needs: [build, nix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          count=$(find release-assets -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) | wc -l)
          if [ "$count" -ne 8 ]; then
            echo "Expected 8 installers, found $count" >&2
            exit 1
          fi
          channel="${RELEASE_TAG#v}"
          if [[ "$channel" == *-* ]]; then
            channel="${channel#*-}"
            channel="${channel%%.*}"
          else
            channel=latest
          fi
          for suffix in '' -mac -linux; do
            test -f "release-assets/${channel}${suffix}.yml"
          done
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --generate-notes "${options[@]}"
