<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <path id="tile" d="M154 32h204c78 0 114 36 114 114v204c0 78-36 114-114 114H154c-78 0-114-36-114-114V146C40 68 76 32 154 32Z"/>
    <path id="rear" d="M8 20h21l21 28-21 28H8l23-28Z"/>
    <path id="front" d="M37 20h22c12 0 24 11 29 28-5 17-17 28-29 28H37l21-28Z"/>
    <linearGradient id="tile-colour" x1="122" y1="32" x2="351" y2="466" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6268ef"/>
      <stop offset=".42" stop-color="#484bd3"/>
      <stop offset="1" stop-color="#292397"/>
    </linearGradient>
    <radialGradient id="tile-light" cx=".43" cy=".08" r=".85">
      <stop stop-color="#a9b2ff" stop-opacity=".28"/>
      <stop offset=".7" stop-color="#737bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile-rim" x1="200" y1="32" x2="270" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e4e7ff" stop-opacity=".42"/>
      <stop offset=".4" stop-color="#959bf5" stop-opacity=".08"/>
      <stop offset="1" stop-color="#131064" stop-opacity=".48"/>
    </linearGradient>
    <linearGradient id="rear-face" x1="20" y1="20" x2="39" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eeefff"/>
      <stop offset=".47" stop-color="#c4c8ff"/>
      <stop offset="1" stop-color="#8d91ed"/>
    </linearGradient>
    <linearGradient id="front-face" x1="48" y1="20" x2="81" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".34" stop-color="#f5f7ff"/>
      <stop offset=".68" stop-color="#d5dcff"/>
      <stop offset="1" stop-color="#abb4f8"/>
    </linearGradient>
    <linearGradient id="rear-side" x1="9" y1="34" x2="33" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#777be1"/>
      <stop offset="1" stop-color="#5e5cc9"/>
    </linearGradient>
    <linearGradient id="front-side" x1="38" y1="30" x2="75" y2="81" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c0c9ff"/>
      <stop offset="1" stop-color="#797bd5"/>
    </linearGradient>
    <linearGradient id="face-rim" x1="48" y1="20" x2="48" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#f4f7ff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#7679d6" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="polish" x1="49" y1="24" x2="67" y2="68" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0"/>
      <stop offset=".48" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="front-clip"><use href="#front"/></clipPath>
    <filter id="tile-shadow" x="-25%" y="-25%" width="150%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="mark-shadow" x="-30%" y="-35%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="contact-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation=".45"/>
    </filter>
  </defs>
  <use href="#tile" transform="translate(0 15)" fill="#24206b" opacity=".26" filter="url(#tile-shadow)"/>
  <use href="#tile" transform="translate(0 3)" fill="#251e86"/>
  <use href="#tile" fill="url(#tile-colour)"/>
  <use href="#tile" fill="url(#tile-light)"/>
  <use href="#tile" stroke="url(#tile-rim)" stroke-width="1.5"/>
  <g transform="translate(88 80) scale(3.5)">
    <g transform="translate(.5 3.7)" fill="#17115d" opacity=".55" filter="url(#mark-shadow)">
      <use href="#rear"/><use href="#front"/>
    </g>
    <g transform="translate(.15 2.25)" fill="#21196e" opacity=".55" filter="url(#contact-shadow)">
      <use href="#rear"/><use href="#front"/>
    </g>
    <use href="#rear" transform="translate(0 1.65)" fill="url(#rear-side)"/>
    <use href="#front" transform="translate(0 1.65)" fill="url(#front-side)"/>
    <use href="#rear" fill="url(#rear-face)"/>
    <use href="#front" fill="url(#front-face)"/>
    <path d="m35 20 53 36v16L35 36Z" fill="url(#polish)" clip-path="url(#front-clip)"/>
    <g stroke="url(#face-rim)" stroke-width=".28" stroke-linejoin="round">
      <use href="#rear"/><use href="#front"/>
    </g>
  </g>
</svg>
