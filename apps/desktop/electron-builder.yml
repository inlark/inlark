appId: app.inlark.com
productName: inlark
publish:
  provider: github
  owner: inlark
  repo: inlark
directories:
  output: release
files:
  - out/**
  - resources/**
  - '!node_modules/**'
  - package.json
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Network
  executableName: inlark
  syncDesktopName: true
  artifactName: 'inlark-${version}-${arch}.${ext}'
  icon: resources/icon.png
  desktop:
    entry:
      MimeType: x-scheme-handler/mailto;
      StartupWMClass: inlark
protocols:
  - name: Email
    schemes: [mailto]
mac:
  target:
    - dmg
    - zip
  icon: resources/icon.png
  artifactName: 'inlark-${version}-${arch}.${ext}'
  forceCodeSigning: true
  hardenedRuntime: true
  notarize: true
win:
  icon: resources/icon.png
  artifactName: 'inlark-${version}-${arch}-setup.${ext}'
  forceCodeSigning: true
  signtoolOptions:
    signingHashAlgorithms: [sha256]
    rfc3161TimeStampServer: http://time.certum.pl
deb:
  packageName: inlark
  depends:
    [
      'libgtk-3-0 | libgtk-3-0t64',
      'libasound2 | libasound2t64',
      libgbm1,
      libdrm2,
      libxkbcommon0,
      libnotify4,
      libnss3,
      libxss1,
      libxtst6,
      xdg-utils,
      libsecret-1-0,
    ]
rpm:
  packageName: inlark
